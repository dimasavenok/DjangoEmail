{% extends 'mainapp/base.html' %}
{% block title %}Профиль{% endblock %}

{% block content %}
<h2>Профиль</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}

  <button class="btn btn-success" type="submit">Сохранить</button>
</form>
{% endblock %}
